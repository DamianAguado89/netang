<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
      <mat-card-subtitle>Doña Pierina · Sin TACC</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="login()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Correo electrónico</mat-label>
          <input
            matInput
            formControlName="email"
            type="email"
            autocomplete="email"
          />
          <mat-error>Ingresá un email válido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            formControlName="password"
            [type]="hidePassword ? 'password' : 'text'"
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            type="button"
            (click)="hidePassword = !hidePassword"
            [attr.aria-label]="hidePassword ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>La contraseña es requerida</mat-error>
        </mat-form-field>

        @if (error()) {
          <p class="error-msg">{{ error() }}</p>
        }

        <button
          mat-flat-button
          class="full-width submit-btn"
          type="submit"
          [disabled]="loading()"
        >
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            Iniciar sesión
          }
        </button>
      </form>

      <div class="divider">
        <span>o</span>
      </div>

      <div id="google-signin-btn" class="google-btn-container"></div>

      <p class="register-link">
        ¿No tenés cuenta? <a routerLink="/register">Registrate</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
