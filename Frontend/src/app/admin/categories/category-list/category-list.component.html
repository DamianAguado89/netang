<div class="category-list-container">
  <div class="list-toolbar d-flex align-items-center justify-content-between flex-wrap gap-2 mb-3">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar por nombre</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput [formControl]="searchControl" placeholder="Ej: Alfajores" />
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon>
      Nueva Categoría
    </button>
  </div>

  @if (error()) {
    <div class="alert alert-danger mb-3" role="alert">
      <mat-icon class="me-2">error_outline</mat-icon>
      {{ error() }}
    </div>
  }

  @if (loading()) {
    <div class="loading-state d-flex justify-content-center align-items-center py-5">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  }

  @if (!loading()) {
    <div class="table-wrapper">
      <table mat-table [dataSource]="filteredCategories()" class="w-100">

        <!-- Nombre -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let c">
            <span class="category-name">{{ c.name }}</span>
          </td>
        </ng-container>

        <!-- Estado -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let c">
            @if (c.isActive) {
              <mat-chip color="primary" highlighted>Activo</mat-chip>
            } @else {
              <mat-chip>Inactivo</mat-chip>
            }
          </td>
        </ng-container>

        <!-- Fecha alta -->
        <ng-container matColumnDef="registrationDate">
          <th mat-header-cell *matHeaderCellDef>Fecha alta</th>
          <td mat-cell *matCellDef="let c">
            {{ c.registrationDate | date: 'dd/MM/yyyy' }}
          </td>
        </ng-container>

        <!-- Acciones -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let c">
            <div class="d-flex gap-1 justify-content-end">
              <button
                mat-icon-button
                color="primary"
                matTooltip="Editar"
                (click)="openEditDialog(c)"
              >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                mat-icon-button
                color="warn"
                matTooltip="Eliminar"
                (click)="openDeleteDialog(c)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
            No se encontraron categorías.
          </td>
        </tr>
      </table>
    </div>
  }
</div>
