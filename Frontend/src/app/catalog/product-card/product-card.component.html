<mat-card class="product-card">
  <div class="product-image">
    @if (imageUrl()) {
      <img [src]="imageUrl()" [alt]="product().name" />
    } @else {
      <div class="image-placeholder">
        <mat-icon>restaurant</mat-icon>
      </div>
    }
  </div>

  <mat-card-header>
    <mat-card-title>{{ product().name }}</mat-card-title>
    <mat-chip-set>
      <mat-chip>{{ product().categoryName }}</mat-chip>
    </mat-chip-set>
  </mat-card-header>

  <mat-card-content>
    @if (product().description) {
      <p class="description">{{ product().description }}</p>
    }
    <p class="price">${{ product().price | number:'1.0-0' }}</p>
  </mat-card-content>

  <mat-card-actions>
    @if (quantity() === 0) {
      <button mat-flat-button color="primary" (click)="add.emit()">
        <mat-icon>add_shopping_cart</mat-icon>
        Agregar
      </button>
    } @else {
      <div class="qty-controls">
        <button mat-icon-button (click)="changeQty.emit(-1)" aria-label="Quitar uno">
          <mat-icon>remove</mat-icon>
        </button>
        <span class="qty-value">{{ quantity() }}</span>
        <button mat-icon-button (click)="changeQty.emit(1)" aria-label="Agregar uno">
          <mat-icon>add</mat-icon>
        </button>
      </div>
    }
  </mat-card-actions>
</mat-card>
